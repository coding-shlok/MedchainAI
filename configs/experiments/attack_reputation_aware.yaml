# Defence-AWARE attack. This is the config that matters most for the paper's
# credibility -- report where this one breaks the defence, do not hide it.
seed: 0
data: {name: synthetic, num_classes: 4, dim: 30, n: 3000, separation: 1.1, noise: 1.6}
partition: {strategy: dirichlet, alpha: 0.5, num_clients: 10}
model: {hidden_dim: 32, lr: 0.1, batch_size: 32, local_epochs: 2}
attack:
  name: reputation_aware
  malicious_fraction: 0.3
  start_round: 0
  params: {budget: 0.3}
reputation: {beta: 0.7, alpha_cos: 0.7, trust_threshold: 0.15, threshold_mode: relative, relative_k: 1.5}
dp: {enabled: false}
simulation: {num_rounds: 30, aggregator: reputation, results_dir: results/attack_reputation_aware}
